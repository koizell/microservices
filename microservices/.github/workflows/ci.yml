name: microservices-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - event-service
          - ticketing-service
          - notification-service
          - credential-service
          - agenda-service
          - analytics-service
          - mobile-api-service
          - api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: microservices/${{ matrix.service }}/package-lock.json

      - name: Install deps
        working-directory: microservices/${{ matrix.service }}
        run: npm install

      - name: Build
        working-directory: microservices/${{ matrix.service }}
        run: npm run build
