global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'

  - job_name: 'event-service'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/metrics'

  - job_name: 'ticketing-service'
    static_configs:
      - targets: ['localhost:3002']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['localhost:3003']
    metrics_path: '/metrics'

  - job_name: 'credential-service'
    static_configs:
      - targets: ['localhost:3004']
    metrics_path: '/metrics'

  - job_name: 'agenda-service'
    static_configs:
      - targets: ['localhost:3005']
    metrics_path: '/metrics'

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['localhost:3006']
    metrics_path: '/metrics'

  - job_name: 'mobile-api-service'
    static_configs:
      - targets: ['localhost:3007']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['localhost:3008']
    metrics_path: '/metrics'
