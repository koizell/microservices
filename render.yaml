envVarGroups:
  - name: eventhive-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"

services:
  - type: web
    runtime: node
    name: eventhive-user-service
    plan: free
    region: oregon
    rootDir: microservices/user-service
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /users
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: eventhive-notification-service
          type: web
          property: hostport
      - key: APP_BASE_URL
        sync: false

  - type: web
    runtime: node
    name: eventhive-event-service
    plan: free
    region: oregon
    rootDir: microservices/event-service
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /events
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false

  - type: web
    runtime: node
    name: eventhive-ticketing-service
    plan: free
    region: oregon
    rootDir: microservices/ticketing-service
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /tickets
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false
      - key: EVENT_SERVICE_URL
        fromService:
          name: eventhive-event-service
          type: web
          property: hostport
      - key: CREDENTIAL_SERVICE_URL
        fromService:
          name: eventhive-credential-service
          type: web
          property: hostport
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: eventhive-notification-service
          type: web
          property: hostport

  - type: web
    runtime: node
    name: eventhive-notification-service
    plan: free
    region: oregon
    rootDir: microservices/notification-service
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /notifications
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false
      - key: TICKETING_SERVICE_URL
        fromService:
          name: eventhive-ticketing-service
          type: web
          property: hostport
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: EMAIL_FROM
        sync: false

  - type: web
    runtime: node
    name: eventhive-credential-service
    plan: free
    region: oregon
    rootDir: microservices/credential-service
    buildCommand: npm install && npm run build
    startCommand: node dist/main
    healthCheckPath: /credentials/health
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false

  - type: web
