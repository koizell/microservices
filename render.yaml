# Blueprint EventHive. Modificar este archivo dispara redeploy de los servicios
# autoDeploy. Bump al final de envVarGroups o un cambio inocuo en value tambien sirve.
envVarGroups:
  - name: eventhive-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"

services:
  - type: web
    runtime: node
    name: eventhive-user-service
    plan: free
    region: oregon
    rootDir: microservices/user-service
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /users/health
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        value: https://eventhive-notification-service.onrender.com
      - key: APP_BASE_URL
        sync: false

  - type: web
    runtime: node
    name: eventhive-event-service
    plan: free
    region: oregon
    rootDir: microservices/event-service
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /events/health
    envVars:
      - fromGroup: eventhive-shared
      - key: DATABASE_URL
        sync: false
      - key: TICKETING_SERVICE_URL
        value: https://eventhive-ticketing-service.onrender.com
      - key: GATEWAY_BASE_URL
        value: https://eventhive-api-gateway.onrender.com

  - type: web
    runtime: node
    name: eventhive-ticketing-service
    plan: free
    region: oregon
    rootDir: microservices/ticketing-service
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /tickets/health
